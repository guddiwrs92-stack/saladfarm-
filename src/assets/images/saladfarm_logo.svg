<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Circular border gradient: Amber-Yellow -> Bright Orange -> Red-Coral -> Deep Pink/Magenta -->
    <linearGradient id="saladfarmRingGrad" x1="15%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="25%" stop-color="#FF6D00" />
      <stop offset="55%" stop-color="#FF2442" />
      <stop offset="85%" stop-color="#E5006D" />
      <stop offset="100%" stop-color="#C2185B" />
    </linearGradient>

    <!-- Warm orange for the wordmark -->
    <linearGradient id="orangeWordmark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7500" />
      <stop offset="100%" stop-color="#FA6400" />
    </linearGradient>
  </defs>

  <!-- 1. White Background Circle -->
  <circle cx="250" cy="250" r="240" fill="#FFFFFF" />

  <!-- 2. Outer Gradient Circular Border -->
  <circle
    cx="250"
    cy="250"
    r="228"
    stroke="url(#saladfarmRingGrad)"
    stroke-width="17"
    fill="none"
  />

  <!-- 3. Food Cloche / Dome & Fork Illustration (Top Right above 'farm') -->
  <g id="cloche-and-fork">
    <!-- Green Cloche Dome -->
    <path
      d="M 296 208 A 68 68 0 0 1 428 208"
      stroke="#43A047"
      stroke-width="8"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Two Sprouts at the Apex of Dome (cx=362, cy=140) -->
    <!-- Left Sprout -->
    <path
      d="M 362 145 C 352 138 340 137 329 140 C 330 152 338 159 349 158 C 356 157 360 151 362 145 Z"
      fill="#43A047"
    />
    <!-- Right Sprout -->
    <path
      d="M 362 145 C 372 138 384 137 395 140 C 394 152 386 159 375 158 C 368 157 364 151 362 145 Z"
      fill="#43A047"
    />

    <!-- Left Green Leaf inside Cloche -->
    <path
      d="M 350 220 C 328 206 320 186 324 167 C 342 167 356 186 357 206 C 357 213 354 218 350 220 Z"
      fill="#388E3C"
    />
    <!-- Center white vein for green leaf -->
    <path
      d="M 333 176 Q 346 196 351 216"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Right Orange Leaf inside Cloche -->
    <path
      d="M 355 220 C 364 210 382 178 396 166 C 400 186 386 211 369 221 C 363 222 358 221 355 220 Z"
      fill="#FF8F00"
    />
    <!-- Center white vein for orange leaf -->
    <path
      d="M 389 175 Q 377 196 363 218"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Horizontal Green Fork Under Cloche -->
    <!-- Fork handle on left -->
    <rect x="292" y="225" width="84" height="10" rx="5" fill="#43A047" />
    <!-- Fork head connector -->
    <path d="M 374 223 L 392 220 C 397 220 398 224 398 230 C 398 236 397 240 392 240 L 374 237 Z" fill="#43A047" />
    <!-- 3 Horizontal Prongs -->
    <!-- Top Prong -->
    <rect x="395" y="222" width="34" height="4.5" rx="2.2" fill="#43A047" />
    <!-- Middle Prong -->
    <rect x="395" y="228" width="34" height="4.5" rx="2.2" fill="#43A047" />
    <!-- Bottom Prong -->
    <rect x="395" y="234" width="34" height="4.5" rx="2.2" fill="#43A047" />
  </g>

  <!-- 4. "Saladfarm" Script Wordmark -->
  <g id="saladfarm-wordmark" fill="url(#orangeWordmark)">
    <!-- Letter 'S' with signature top and bottom teardrop loops -->
    <path d="M 96 230 C 90 220 95 212 108 212 C 122 212 134 224 134 238 C 134 256 116 270 102 284 C 92 294 92 308 106 312 C 122 316 136 304 146 292 C 150 287 155 290 152 296 C 139 314 118 322 98 316 C 80 310 78 288 90 274 C 104 258 122 246 122 234 C 122 226 116 220 108 220 C 98 220 94 226 94 230 C 94 234 98 234 96 230 Z" />
    
    <!-- Letter 'a' (first) -->
    <path d="M 148 274 C 148 258 160 248 174 248 C 188 248 196 258 196 272 L 196 302 C 196 308 199 310 203 310 C 206 310 208 308 209 305 L 209 295 C 206 290 200 286 200 274 C 200 256 186 244 168 244 C 150 244 136 256 136 276 C 136 296 150 312 172 312 C 182 312 192 307 197 298 L 197 304 C 197 312 203 316 211 316 C 218 316 223 310 223 302 L 223 270 C 223 252 210 240 188 240 C 168 240 154 250 148 266 C 146 271 150 274 148 274 Z M 186 274 C 186 288 178 298 168 298 C 158 298 152 288 152 276 C 152 264 160 254 170 254 C 180 254 186 262 186 274 Z" />

    <!-- Letter 'l' -->
    <path d="M 223 218 C 217 218 213 223 213 230 L 213 302 C 213 310 219 316 227 316 C 235 316 241 310 241 302 L 241 230 C 241 223 235 218 227 218 L 223 218 Z" />

    <!-- Letter 'a' (second) -->
    <path d="M 248 274 C 248 258 260 248 274 248 C 288 248 296 258 296 272 L 296 302 C 296 308 299 310 303 310 C 306 310 308 308 309 305 L 309 295 C 306 290 300 286 300 274 C 300 256 286 244 268 244 C 250 244 236 256 236 276 C 236 296 250 312 272 312 C 282 312 292 307 297 298 L 297 304 C 297 312 303 316 311 316 C 318 316 323 310 323 302 L 323 270 C 323 252 310 240 288 240 C 268 240 254 250 248 266 C 246 271 250 274 248 274 Z M 286 274 C 286 288 278 298 268 298 C 258 298 252 288 252 276 C 252 264 260 254 270 254 C 280 254 286 262 286 274 Z" />

    <!-- Letter 'd' -->
    <path d="M 347 216 C 339 216 333 222 333 230 L 333 254 C 327 246 317 242 306 242 C 286 242 270 258 270 278 C 270 298 286 314 306 314 C 318 314 328 308 333 299 L 333 302 C 333 310 339 316 347 316 C 355 316 361 310 361 302 L 361 230 C 361 222 355 216 347 216 Z M 333 278 C 333 290 324 300 313 300 C 302 300 294 290 294 278 C 294 266 302 256 313 256 C 324 256 333 266 333 278 Z" />

    <!-- Letter 'f' -->
    <path d="M 379 216 C 369 216 363 224 363 236 L 363 248 L 354 248 C 349 248 345 252 345 257 C 345 262 349 266 354 266 L 363 266 L 363 322 C 363 334 358 340 348 340 C 344 340 340 338 338 336 C 335 342 340 348 348 348 C 364 348 375 338 375 320 L 375 266 L 388 266 C 393 266 397 262 397 257 C 397 252 393 248 388 248 L 375 248 L 375 236 C 375 229 378 226 382 226 C 386 226 389 229 391 231 C 393 226 391 221 387 218 C 385 217 382 216 379 216 Z" />

    <!-- Letter 'a' (third) -->
    <path d="M 406 274 C 406 258 418 248 432 248 C 446 248 454 258 454 272 L 454 302 C 454 308 457 310 461 310 C 464 310 466 308 467 305 L 467 295 C 464 290 458 286 458 274 C 458 256 444 244 426 244 C 408 244 394 256 394 276 C 394 296 408 312 430 312 C 440 312 450 307 455 298 L 455 304 C 455 312 461 316 469 316 C 476 316 481 310 481 302 L 481 270 C 481 252 468 240 446 240 C 426 240 412 250 406 266 C 404 271 408 274 406 274 Z M 444 274 C 444 288 436 298 426 298 C 416 298 410 288 410 276 C 410 264 418 254 428 254 C 438 254 444 262 444 274 Z" />

    <!-- Letter 'r' -->
    <path d="M 386 250 C 379 250 374 255 374 262 L 374 302 C 374 309 379 315 386 315 C 393 315 398 309 398 302 L 398 278 C 402 271 408 266 415 266 C 418 266 421 267 423 269 C 425 264 423 258 418 254 C 413 251 407 250 402 252 C 397 254 391 259 388 265 L 388 262 C 388 255 383 250 376 250 L 386 250 Z" />

    <!-- Letter 'm' -->
    <path d="M 406 250 C 399 250 394 255 394 262 L 394 302 C 394 309 399 315 406 315 C 413 315 418 309 418 302 L 418 278 C 422 268 430 264 438 264 C 445 264 450 269 450 278 L 450 302 C 450 309 455 315 462 315 C 469 315 474 309 474 302 L 474 278 C 478 268 486 264 494 264 C 501 264 506 269 506 278 L 506 302 C 506 309 511 315 518 315 C 525 315 530 309 530 302 L 530 274 C 530 258 518 250 503 250 C 492 250 482 256 476 266 C 471 256 461 250 450 250 C 440 250 431 256 426 266 L 426 262 C 426 255 421 250 414 250 L 406 250 Z" transform="matrix(0.72 0 0 1 106 0)" />
  </g>

  <!-- 5. Tagline: "BUILT FOR FITNESS. LOVED FOR TASTE" -->
  <g id="tagline-group">
    <text
      x="255"
      y="350"
      text-anchor="middle"
      fill="#1B382B"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="16.5"
      font-weight="800"
      letter-spacing="2.2"
    >
      BUILT FOR FITNESS. LOVED FOR TASTE
    </text>

    <!-- Green Leaf Accent on the Bottom Right of Tagline -->
    <g transform="translate(418, 332)">
      <path
        d="M 28 8 C 24 2 12 -2 2 3 C -1 16 7 26 20 25 C 27 24 29 16 28 8 Z"
        fill="#43A047"
      />
      <!-- White vein line in leaf -->
      <path
        d="M 6 8 Q 16 15 25 21"
        stroke="#FFFFFF"
        stroke-width="1.8"
        stroke-linecap="round"
        fill="none"
      />
    </g>
  </g>
</svg>
